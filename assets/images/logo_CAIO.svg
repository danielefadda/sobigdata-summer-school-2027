<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 702 216">
  <defs>
    <style>
      /* ── stroke draw-on paths ── */
      .sp {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }
      .sp-brown { stroke: #594a42; }
      .sp-teal  { stroke: #348b96; }

      /* timing offsets */
      #s-border   { stroke-dasharray: 2600; stroke-dashoffset: 2600; animation: draw 1.2s ease forwards 0.1s; }
      #s-c        { stroke-dasharray: 850;  stroke-dashoffset: 850;  animation: draw 0.85s ease forwards 1.1s; }
      #s-a        { stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: draw 0.85s ease forwards 1.75s; }
      #s-i-top    { stroke-dasharray: 460;  stroke-dashoffset: 460;  animation: draw 0.45s ease forwards 2.45s; }
      #s-i-bottom { stroke-dasharray: 560;  stroke-dashoffset: 560;  animation: draw 0.45s ease forwards 2.7s;  }
      #s-o        { stroke-dasharray: 850;  stroke-dashoffset: 850;  animation: draw 0.85s ease forwards 2.95s; }

      /* fill layer fades in after drawing is done */
      .fill-layer  { opacity: 0; animation: fadeIn  0.55s ease forwards 4.0s; }
      /* stroke layer fades out at the same time */
      .stroke-layer { animation: fadeOut 0.4s  ease forwards 4.0s; }

      @keyframes draw    { to { stroke-dashoffset: 0; } }
      @keyframes fadeIn  { to { opacity: 1; } }
      @keyframes fadeOut { to { opacity: 0; } }
    </style>
  </defs>

