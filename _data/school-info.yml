aim: |
  The growing integration of artificial intelligence into online platforms is turning algorithms into active, and far from neutral, mediators of human experience, capable of amplifying phenomena such as <strong>polarization, bias and inequality</strong>. To understand how these collective dynamics emerge, a new line of research is taking shape around the concept of <strong>human–AI coevolution</strong>: an iterative process in which human choices feed algorithms and, in turn, algorithms steer and structure human choices.




aim_extended: |
  The SoBigData Summer School will explore the main aspects of this research area: the <strong>empirical analysis</strong> of coevolution patterns on online platforms; the <strong>theoretical and computational modelling</strong> of the underlying socio-technical mechanisms; and the study of possible <strong>interventions</strong> and the <strong>design of algorithms</strong> able to reconcile users' individual goals with collective wellbeing.

  The program combines at least <strong>20 hours of lectures</strong> by national and international experts with a substantial component of <strong>project work in multidisciplinary groups</strong>. Projects are driven by <strong>challenges</strong> proposed by researchers and domain experts, developed with the support of <strong>dedicated tutors</strong>, and presented on the final day to a panel of experts. The school is promoted together with the <strong>Italian National PhD Program in Artificial Intelligence (PhD AI)</strong> and leverages the tools and resources of the <strong>SoBigData Research Infrastructure</strong>.

topics:
  - Human–AI Coevolution
  - Complex Social Systems
  - Computational Social Science
  - Recommender Systems
  - Polarization and Bias
  - Agent-based and Network Models
  - Algorithmic Interventions
  - Data Science
  - Artificial Intelligence
  - Responsible AI

target_attendees:
  - PhD Students of the Italian National PhD Program in AI (priority)
  - PhD Students from other programs
  - Postgraduate Students
  - Early-career Researchers
  - Professionals interested in data analysis and AI


