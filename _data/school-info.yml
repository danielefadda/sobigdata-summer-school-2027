days:
  - day: "Day 1: SoBigData RI and Project Challenges"
    description: |
      The opening day starts with a round of presentations of the participants, followed by an introduction to the SoBigData Research Infrastructure and to the school, and a tutorial on the SoBigData Lab. The project challenges are then presented and, in the Group Decision Challenge session, participants form the multidisciplinary groups that will work on them throughout the week. In the afternoon, groups start developing their projects with the guidance of dedicated tutors.
  - day: "Day 2: Human–AI Coevolution and Interaction"
    description: |
      The second day focuses on how people and AI systems interact and influence each other. Lectures cover the path from interpretability methods to interpretable models, the concept of human–AI coevolution, how to enable the human in the loop, and human–AI interaction. The afternoon is dedicated to project work with tutors.
  - day: "Day 3: Human Control, Explainability and Data Governance"
    description: |
      This day addresses how humans can keep meaningful control over autonomous systems. Lectures cover meaningful human control, the relationship between humans and AI, explainability, and the governance of personal and non-personal data. After a project session with tutors, the rest of the afternoon is free.
  - day: "Day 4: Policies, Data and Society"
    description: |
      The fourth day connects data and AI with policy and society. Lectures cover the relationship between policies and data, data representation, the role of social science data archives, and the monitoring of electoral democracy. The afternoon is dedicated to finalising the projects with tutors.
  - day: "Day 5: Project Presentations"
    description: |
      The final day is dedicated to the presentation of the projects developed by the groups during the week. Results will be presented to a panel of experts, who will evaluate them on relevance to the challenge, methodological rigour, innovation, feasibility, quality of the presentation and the group's ability to integrate interdisciplinary skills and ethical considerations.
