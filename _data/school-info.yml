days:
  - day: "Day 1: SoBigData RI and Project Challenges"
    description: |
      The opening day introduces participants to the SoBigData Research Infrastructure and to the concept of human–AI coevolution, providing an overview of the tools, data and services available to the research community. Researchers and domain experts will then present the project challenges: concrete problems that participants will tackle in multidisciplinary groups throughout the week with the guidance of dedicated tutors.
  - day: "Day 2: Measuring Human–AI Coevolution"
    description: |
      The second day is devoted to the empirical analysis of coevolution patterns on online platforms. Participants will explore how data from social media, recommender systems and other AI-mediated services can be used to detect feedback loops between users and algorithms, and to measure their effects on phenomena such as polarization, bias and inequality.
  - day: "Day 3: Modelling Socio-technical Systems"
    description: |
      This day focuses on the theoretical and computational modelling of the socio-technical mechanisms underlying human–AI coevolution. Through lectures and case studies, participants will learn how network models, agent-based simulations and other complex-systems approaches can be used to understand how individual behaviour and algorithmic recommendations jointly shape collective dynamics.
  - day: "Day 4: Interventions and Algorithm Design"
    description: |
      The fourth day addresses how to steer human–AI coevolution towards desirable outcomes. Participants will examine possible interventions and the design of algorithms able to reconcile users' individual goals with collective wellbeing, discussing fairness, transparency and the ethical and regulatory implications of AI-mediated platforms.
  - day: "Day 5: Project Presentations and Closing Remarks"
    description: |
      The final day is dedicated to the presentation of the projects developed by the groups during the week. Results will be presented to a panel of lecturers and experts, who will evaluate them on relevance to the challenge, methodological rigour, innovation, feasibility, quality of the presentation and the group's ability to integrate interdisciplinary skills and ethical considerations. The school will close with final remarks and feedback.
