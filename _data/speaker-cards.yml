- name: "Francesco"
  surname: "Oleni"
  institution: "Volley Lube"
  img_url: "/assets/images/speaker_Oleni.png"
  description: ""
  topics: ["Sports Analytics", "Data Mining", "Volleyball"]
  home: false
  title: "Project Challenges Presentation"
  bio: "Francesco Oleni is a volleyball analyst and assistant coach currently with Volley Lube, competing in the Italian SuperLega and the CEV Champions League. Over nearly two decades he has worked with top-level clubs and national teams across Italy, Poland, Russia, China, South Korea, Qatar, and Denmark — including roles with the men's national teams of China and Denmark and trophies such as the Korean V-League title and a CEV Cup. His work focuses on match analysis, data-driven scouting, and video analysis to support tactical decision-making at the highest competitive level."
  day: 1
  program: true
- name: "Matteo"
  surname: "Marescotti"
  institution: "Ospedalieri Volley Pisa"
  img_url: "/assets/images/speaker_Marescotti.png"
  description: ""
  topics: ["Sports Analytics", "Biokinetics", "Volleyball"]
  home: false
  title: "Project Challenges Presentation"
  bio: "Matteo Marescotti is a volleyball coach currently working in Pisa with the developing  and senior team. Interested in motor learning and anatomy, he achieved a Master degree in Biokinetics at Coimbra University, with a thesis focused on the prevention of anterior cruciate ligament (ACL) injuries. His academic background is completed with a master degree in Sport Science and Techniques achieved in Genova. "
  day: 1
