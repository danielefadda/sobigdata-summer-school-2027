- name: "Valerio"
  surname: "Grossi"
  institution: "Institute of Information Science and Technologies (ISTI) of the National Research Council of Italy (CNR)"
  img_url:  "/assets/images/speaker_Grossi.jpg"
  description: "This tutorial will provide an introduction to the SoBigData Lab, a comprehensive platform for big data analytics and social mining. Participants will learn how to access and utilize the lab's tools and resources for their research projects, with a focus on practical applications in data analysis, machine learning, and ethical considerations in data science."
  topics: ["Research Infrastructure","Social Mining","Ethical Data Science"]
  home: false
  title: "Tutorial SoBigData Lab"
  bio: "Valerio Grossi is a Senior Researcher at ISTI-CNR. He holds a PhD in Computer Science from the University of Pisa. His research interests focus on machine learning and the analysis of massive and complex data, including data stream mining, ontology-driven mining, business intelligence, and automatic knowledge extraction systems. He is a member of SoBigData's management team."
  day: 1
  program: true
- name: "Anna"
